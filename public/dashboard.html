<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEDAR Operations</title><style>body{font-family:system-ui;margin:40px auto;max-width:960px;padding:24px;background:#f6f7f9}section{background:#fff;border-radius:16px;padding:20px;margin:16px 0}button{padding:10px 14px;border:0;border-radius:10px;background:#111;color:#fff}input{padding:10px;border:1px solid #ddd;border-radius:10px}pre{white-space:pre-wrap}</style></head><body><h1>SEDAR Operations</h1><p>CopilotKit-backed operations surface for the Telegram agent.</p><section><h2>Agent state</h2><input id="uid" placeholder="Telegram chat id"><button onclick="loadState()">Load</button><pre id="state"></pre></section><section><h2>CopilotKit</h2><p>Runtime endpoint: <code>/api/copilotkit</code></p></section><section><h2>Daily summary</h2><pre id="summary"></pre></section><script>async function loadState(){const id=document.getElementById('uid').value;const s=await fetch('/api/admin/user/'+encodeURIComponent(id)).then(r=>r.json());const x=await fetch('/api/admin/summary/'+encodeURIComponent(id)).then(r=>r.json());document.getElementById('state').textContent=JSON.stringify(s,null,2);document.getElementById('summary').textContent=JSON.stringify(x,null,2)}</script></body></html>
